name: bobobeads
description: "Convert images into bead patterns for perler bead art."
publish_to: 'none'

version: 1.0.0+14

environment:
  sdk: ^3.11.0-113.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  image: ^4.3.0
  pdf: ^3.11.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  image_picker: ^1.1.0
  camera: ^0.11.1
  permission_handler: ^12.0.1
  flutter_svg: ^2.2.3
  flutter_cache_manager: ^3.4.1
  in_app_review: ^2.0.10
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  protobuf: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  protoc_plugin: ^25.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/figma_home/
    - assets/figma_home/blind_box/
    - assets/figma_my/
    - assets/figma_style/
    - assets/pin_icon/
    - ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
    - assets/palettes/mard221.csv
  fonts:
    - family: Z Labs RoundPix 12px M CN
      fonts:
        - asset: assets/fonts/ZLabsRoundPix_12px_M_CN.ttf
    - family: Alimama FangYuanTi VF
      fonts:
        - asset: assets/fonts/AlimamaFangYuanTiVF-Thin-2.ttf
    - family: Taprom
      fonts:
        - asset: assets/fonts/Taprom-Regular.ttf
dependency_overrides:
  # path_provider_foundation 2.6.x 改为依赖 Objective-C FFI 原生资产。
  # 当前 Flutter iOS 调试构建无法在运行时解析该资产，导致读取登录态
  # 就提前失败，所有接口均不会真正发出。固定到最后一个通道实现版本。
  path_provider_foundation: 2.4.4
